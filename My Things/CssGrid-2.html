<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grids</title>
    <!-- Grids ka use layouts design ke liye kiya jata h. -->
     <!-- grid-1 me to apne ne ek treeka use kiye items ko place krne ka and ab grid-2 me apne doosra treeka use krenge. -->
    <style>
        .container{
            border: 4px solid black;
            display: grid;
            grid-template-areas: "nav nav nav"
                                 "side article article" /* Iski mdad se apne areas define kar skte hai grids me. Jaise "nav nav nav" ek row hogyi and us ek row me jitna area hai vo sirf nav me hoga, and har ek nav ek column me aajayega. Same "side article sidebar" dusri row hogyi. */
                                 "footer footer footer";
        }

        .item{
            border: 4px solid red;
            height: 55px;
        }

        .item-1{
            grid-area: nav; /* Ye poora nav wala le lega. sirf apne ne "nav" name likha hai pehli row of grid me to isiliye use ek maanega and poori row sirf yhi item cover kr lega.*/
            background-color: aquamarine;
        }

        .item-2{
            grid-area: side;
            background-color: bisque;
        }

        .item-3 {
            grid-area: article;
            background-color: rgb(203, 161, 242);
        }
        
        .item-4 {
            grid-area: footer;
            background-color: rgb(142, 142, 241);
        }
        
        .item-5 {
            grid-area: nav; /* overlap kra skte hai apne items ko. */
            background-color: rgb(0, 247, 255);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
    </div>
</body>
</html>
