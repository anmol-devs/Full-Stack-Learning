<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS object Fit and position</title>
    <!-- Ye property jo images vgera hoti hai unhe box me properly fit krne me help krti hai. -->
    <style>
        .container {
            height: 488px;
            width: 466px;
            border: 2px solid black;
            /* background-color: azure; */
            
            /* NEECHE TO APNO NE IMAGE PR ALAG SE WORK KARA, AND AGAR APNE BACKGROUND ME IMAGE SET KRNA CHAHTE HAI TO IS METHOD KA USE KRENGE. Isse koi image download krna chahe to download nhi hoti. Isse 'open image in new tab' ka option nhi aata right-click krne pr. */
            background-image: url("https://us.123rf.com/450wm/progressman/progressman1909/progressman190900115/130695651-woman-in-black-coat-walking-along-the-sea.jpg?ver=6");

            background-position: center center;
            /*Sane, jaise apno ne 'img' waale me position ka use kra tha, vaise hi yaha bhi kar skte hai, without image ka aspect-ratio ko change kre. */

            background-repeat: no-repeat;
            /* Image ko background me lgate hai to image automatically repeat hoti hai in both x and y direction. 'no-repeat' se na x me repeat hoga and na hi y me repeat hoga. And if apne 'repeat-x' kr denge, and agar background-image ki jo width hai vo choti hogi to x me repeat hoga, and y me repeat nhi hoga. Same for y. */

            background-clip: border-box;

        }

        img {
            width: 466px; /* simply width, height dene se image apne aspect ratio ke according nhi aayegi. */
            height: 488px;
            /* object-fit: cover; */
            /* ye 'cover' waali property is img waale me hi jitni width height do hai apno ne usi me image ka aspect ratio ke according image fit hogi, cover kregi ye width-height. Ise parent ki width-height se koi mtlb nhi hai. Isse aspect-ratio to maintain ho jaaega but, image cut ho jaaegi. */
            
            /* object-position: top right; */
            /* object-position: bottom right; */
            /* Apne 'cover' waali property use krte hai to image cut hoti hai, and agar apne ko btana hai ki image cut kaha se ho and kaha se na ho to apne 'object-position' property ka use krte hai. Apne 'top right' choose krenge to image ka top right wala portion dikhaega. Same aise hi 'bottom right' krenge to bottom right wala hissa dikhega. */
            
            object-fit: contain;
            /* Ye 'conatin' waale property ki mdad se apne image ko cut hone se bcha skenge. Ye property is 'img' me jo width-height hai, usi me image ko conatin kr degi, and cut nhi kregi. Isse image poora dikhega, and agar poora dikhana hai and aspect ratio bhi maintain krwana hai to space bachega. */
            
            /* object-fit: fill; */ /* 'fill' by-default property hoti hai 'object-fit' ki. */
           
            object-position: 10px 20px;
            /* Isse apne position set kr skte hai image ki in both pixels and percentage. 50-50% krenge to center ka part dikhaega image ka. */
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- <img src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D" alt=""> -->
    </div>
</body>

</html>
