<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event bubbling</title>
    <style>
        .child {
            background-color: aliceblue;
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }

        .childContainer {
            background-color: beige;
            padding: 14px;
            margin: 14px;
        }

        .container {
            background-color: rgb(227, 227, 28);
            padding: 14px;
            margin: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                I am a child
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("Child Was clicked")
        })

        document.querySelector(".childContainer").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("childContainer Was clicked")
        })

        document.querySelector(".container").addEventListener("click", (e) => {
            alert("container Was clicked")
        })

        // Event Bubbling: Jab aap child par click kroge to automatically uske parent par bhi click event trigger ho jayega aur uske parent ke parent par bhi click event trigger ho jayega. Is process ko event bubbling kehte hai. 'child'par click karne par 'childContainer' aur 'container' par bhi click event trigger ho jayega. Agar aap nahi chahte ki parent par click event trigger ho to aap event.stopPropagation() method ka use kar sakte hai.

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`
        }
        // let a = setInterval(() => {
        //     document.querySelector(".childContainer").style.background = getRandomColor();
        // }, 1000);

        // console.log(a)
        // "clearInterval()" method ka use karke aap setInterval ko rok sakte hai. 


        // "setTimeout()" method ek baar call hota hai ek particular time interval ke baad, and "setInterval()" method repeatedly call hota hai har particular time interval ke baad.
        let a = setTimeout(() => {
            document.querySelector(".childContainer").style.background = getRandomColor();
        }, 5000);

        console.log(a)
        // "clearTimeout()" method ka use karke aap setTimeout ko rok sakte hai.

    </script>
</body>

</html>
