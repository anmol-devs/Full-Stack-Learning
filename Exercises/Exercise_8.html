<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8</title> 
    <!-- Is exercise me hame ek ball ka bouncing wala animation bnana hai. Jisme ball x-axis and y-axis dono me bounce ho. -->
    <style>
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;   
            animation: animateX 3s linear infinite, animateY 1s ease-out infinite alternate;
            /* linear for x-axis, and ease out for y-axis, because ball ko bounce wala bnana hai to ease-out ki help se jab upr jaaegi ball to slow ho jaaegi upr jaati hui, and hamne alternate use kra taaki neeche aate waqt bhi yhi ho. */
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes animateX {
            from{
                left: 0;
            }
            to{
                left: 100%;
            }
        }

        @keyframes animateY {
           from{
                bottom: 0;
            }
            to{
                bottom: 100% ;
            }
        }
 
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
</body>

</html>
